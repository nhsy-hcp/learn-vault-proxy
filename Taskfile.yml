version: '3'

# Vault workload identity + Vault Proxy + dynamic PostgreSQL credentials on k3d.
# Design: docs/solution-design.md

vars:
  cluster_name: vault-db-lab
  k3s_image: rancher/k3s:v1.36.6-k3s1
  vault_chart_version: "0.34.1"
  vault_image: hashicorp/vault
  vault_version_tag: "2.2.1"
  postgres_image: postgres:16-alpine
  app_image: localhost/db-app:local
  container_cli:
    sh: command -v podman >/dev/null 2>&1 && echo podman || echo docker
  # ce | ent (ent = later optional phase: Proxy static-secret caching)
  vault_edition: ce
  # TTLs: db max_ttl must never exceed token_max_ttl (leases are children of the Proxy token)
  db_default_ttl: 10m
  db_max_ttl: 30m
  token_ttl: 15m
  token_max_ttl: 30m
  kv_refresh_seconds: 30
  outage_minutes: 12

dotenv:
  - .env

tasks:
  # ==========================================================================
  # Standard interface
  # ==========================================================================
  default:
    silent: true
    cmds:
      - task --list

  init:
    desc: One-time setup - install pre-commit hooks, add Helm repo, sync app deps
    cmds:
      - task: deps
      - pre-commit install
      - helm repo add hashicorp https://helm.releases.hashicorp.com 2>/dev/null || true
      - helm repo update hashicorp
      - test -f .env || cp .env.template .env
      - uv sync --project app

  deps:
    desc: Check required CLI tools are installed
    aliases: [prerequisites]
    silent: true
    cmds:
      - scripts/check-deps.sh

  lint:
    desc: Run all pre-commit hooks (yamllint, gitleaks, shellcheck, hadolint, ruff)
    cmds:
      - pre-commit run --all-files

  test:
    desc: Run the db-app unit tests (pytest, no cluster needed)
    dir: app
    cmds:
      - uv run --frozen pytest -q

  build:
    desc: Build the db-app image and import it into the k3d cluster
    cmds:
      - "{{.container_cli}} build -t {{.app_image}} app"
      - "{{.container_cli}} save -o .tmp/db-app.tar {{.app_image}}"
      - k3d image import .tmp/db-app.tar -c {{.cluster_name}}
      - rm -f .tmp/db-app.tar

  clean:
    desc: Delete the k3d cluster, Vault init data and temporary files
    prompt: This deletes the cluster and vault-init.json. Continue?
    cmds:
      - k3d cluster delete {{.cluster_name}} || true
      - rm -f vault-init.json .env.bak
      - rm -rf .tmp/* .pytest_cache .ruff_cache

  up:
    desc: Build the whole lab from scratch (alias of all)
    cmds:
      - task: all

  down:
    desc: Stop the k3d cluster, keeping its data (alias of cluster:stop)
    cmds:
      - task: cluster:stop

  # ==========================================================================
  # Workflow
  # ==========================================================================
  all:
    desc: prerequisites -> cluster -> Vault -> config -> deploy -> verify
    cmds:
      - task: deps
      - task: cluster:up
      - task: install
      - task: install:postgres
      - task: config:k8s-auth
      - task: config:db-secret
      - task: config:kv-secret
      - task: deploy:db-app
      - task: verify:db-app

  install:
    desc: Install, initialise, unseal and configure Vault
    cmds:
      - task: install:vault
      - task: init:vault
      - task: unseal:vault
      - task: config:vault

  # ==========================================================================
  # Cluster
  # ==========================================================================
  cluster:up:
    desc: Create or start the k3d cluster
    aliases: [start, k3d]
    cmds:
      - scripts/cluster-up.sh {{.cluster_name}} {{.k3s_image}}
      - scripts/cluster-ready.sh {{.cluster_name}}

  cluster:stop:
    desc: Stop the k3d cluster (data kept; run unseal:vault after cluster:up)
    cmds:
      - k3d cluster stop {{.cluster_name}}

  cluster:down:
    desc: Delete the k3d cluster
    cmds:
      - k3d cluster delete {{.cluster_name}} || true

  # ==========================================================================
  # Vault
  # ==========================================================================
  install:vault:
    desc: Helm install Vault CE (single-node Raft, NodePort 30820)
    preconditions:
      - sh: kubectl config current-context | grep -q '^k3d-{{.cluster_name}}$'
        msg: kubectl context is not k3d-{{.cluster_name}} - run task cluster:up
    cmds:
      - kubectl create namespace vault --dry-run=client -o yaml | kubectl apply -f -
      - >-
        helm upgrade --install vault hashicorp/vault
        --version {{.vault_chart_version}} -n vault
        --values vault-ce/vault-values.yaml
        --set server.image.repository={{.vault_image}}
        --set server.image.tag={{.vault_version_tag}}
      - |
        for i in $(seq 1 30); do
          kubectl get pod vault-0 -n vault >/dev/null 2>&1 && break
          sleep 2
        done
      - kubectl wait --for=jsonpath='{.status.phase}'=Running pod/vault-0 -n vault --timeout=5m

  init:vault:
    desc: Initialise Vault once; writes vault-init.json and .env
    cmds:
      - scripts/init-vault.sh

  unseal:vault:
    desc: Unseal Vault with 3 keys from vault-init.json
    preconditions:
      - test -f vault-init.json
    cmds:
      - scripts/unseal-vault.sh

  config:vault:
    desc: Audit device to stdout, token reviewer SA and SA-reader RBAC
    preconditions:
      - test -f vault-init.json
    cmds:
      - kubectl exec vault-0 -n vault -- env VAULT_TOKEN="$VAULT_TOKEN" vault audit enable -path=audit_stdout file file_path=stdout || true
      - kubectl apply -f vault-ce/vault-token-reviewer.yaml
      - kubectl apply -f vault-ce/vault-sa-reader-rbac.yaml
    env:
      VAULT_TOKEN:
        sh: jq -r '.root_token' vault-init.json 2>/dev/null || true

  config:k8s-auth:
    desc: Kubernetes auth mount (annotations as alias metadata), templated db-app policy and role
    preconditions:
      - test -f vault-init.json
    cmds:
      - scripts/config-k8s-auth.sh {{.token_ttl}} {{.token_max_ttl}}

  # ==========================================================================
  # PostgreSQL and database secrets engine
  # ==========================================================================
  install:postgres:
    desc: Deploy PostgreSQL 16 with bootstrap SQL (databases, schemas, group roles)
    cmds:
      - scripts/install-postgres.sh

  config:db-secret:
    desc: Database secrets engine, pg-preview/pg-production connections, roles, rotate-root
    preconditions:
      - test -f vault-init.json
    cmds:
      - scripts/config-db-secret.sh {{.db_default_ttl}} {{.db_max_ttl}}

  clean:leases:
    desc: Revoke every dynamic database lease (break-glass for all apps)
    preconditions:
      - test -f vault-init.json
    cmds:
      - kubectl exec vault-0 -n vault -- env VAULT_TOKEN="$VAULT_TOKEN" vault lease revoke -prefix db/creds/
    env:
      VAULT_TOKEN:
        sh: jq -r '.root_token' vault-init.json 2>/dev/null || true

  config:kv-secret:
    desc: KV v2 at kvv2/ (max_versions=5) with one random API key per app
    preconditions:
      - test -f vault-init.json
    cmds:
      - scripts/config-kv-secret.sh

  # ==========================================================================
  # Sample app
  # ==========================================================================
  deploy:db-app:
    desc: Build/import the app image and deploy one namespace, annotated SA and pod per apps.json entry
    cmds:
      - task: build
      - scripts/deploy-db-app.sh {{.app_image}} {{.vault_image}}:{{.vault_version_tag}} {{.kv_refresh_seconds}}

  verify:db-app:
    desc: Scenarios 1, 2, 10 - zero-secret bootstrap, own data, own API key
    cmds:
      - scripts/verify-db-app.sh

  status:
    desc: Show cluster, Vault and app status
    silent: true
    cmds:
      - kubectl get nodes
      - kubectl get pods -A -l 'app.kubernetes.io/name in (vault,postgres,db-app)' 2>/dev/null || true
      - vault status -address=http://127.0.0.1:8200 || true
